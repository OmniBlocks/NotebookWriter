name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Delete old package-lock.json
        run: rm -f package-lock.json

      - name: Configure git to use HTTPS instead of SSH
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Upgrade abcjs to v6 (fixes MIDI.js issue)
        run: npm install abcjs@^6.0.0 --legacy-peer-deps --ignore-scripts

      - name: Install all dependencies without running build scripts
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Replace node-sass with sass (dart-sass)
        run: |
          npm uninstall node-sass
          npm install sass --save-dev --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
